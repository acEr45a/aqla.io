<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AQLA Banner Render</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 460px;
      background-color: #08090a;
      background-image: 
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(201, 242, 78, 0.07) 0%, rgba(8, 9, 10, 0) 70%),
        radial-gradient(circle at 50% 50%, #0d0f12 0%, #050607 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    /* Subtle grid accent */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glow-disc {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 242, 78, 0.35) 0%, rgba(201, 242, 78, 0) 70%);
      filter: blur(14px);
    }
    .wordmark {
      color: #ffffff;
      font-size: 46px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-left: 0.28em; /* offset for tracking */
      margin-bottom: 12px;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
    }
    .tagline {
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-left: 0.22em;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: rgba(201, 242, 78, 0.4);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  
  <div class="logo-container">
    <div class="glow-disc"></div>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="84" height="84" style="position: relative; z-index: 2;">
      <path d="M8.5 32.5 18.5 11.5 28.5 32.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m28.5 32.5 7.5 -8.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <path d="m12.8 23.5 7.8 0" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="22.5" cy="23.5" r="7.5" fill="#C9F24E" opacity="0.22"/>
      <circle cx="22.5" cy="23.5" r="3.6" fill="#C9F24E"/>
    </svg>
  </div>

  <div class="wordmark">AQLA</div>
  <div class="divider"></div>
  <div class="tagline">Personal Brain Operating System</div>
</body>
</html>
